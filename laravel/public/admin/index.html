<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Админка</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="../config.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="admin">
  <div class="login" id="login">
    <form class="login__card form" id="login-form" novalidate>
      <div>
        <h1 class="login__title">Вход в админку</h1>
        <p class="muted" data-site-name></p>
      </div>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Пароль</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="form__error" role="alert" hidden></p>
      <button class="btn btn--block" type="submit">Войти</button>
    </form>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="sidebar">
      <div class="sidebar__head">
        <div class="sidebar__name" data-site-name></div>
        <a class="sidebar__site" href="../" target="_blank" rel="noopener">Открыть сайт ↗</a>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav" aria-label="Разделы админки"></nav>
      <div class="sidebar__foot">
        <span id="admin-email"></span>
        <button class="link" type="button" id="logout">Выйти</button>
      </div>
    </aside>
    <main class="content" id="view"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
